name: Frame identity regression
on:
  push:
    branches: [fix/viewer-frame-identity]
  pull_request:
    paths:
      - 'Python雷达可视化工具示例/**'
      - '.github/workflows/viewer-frame-identity.yml'
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy pandas matplotlib
      - run: python -m unittest discover -s Python雷达可视化工具示例/tests -p 'test_identity_regression.py' -v
        env:
          MPLBACKEND: Agg
          PYTHONDONTWRITEBYTECODE: '1'
