name: Fixed simulation noise
on:
  push:
    branches: [fix/cart-fixed-noise-study]
  pull_request:
    paths:
      - 'community/projects/**'
jobs:
  octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - run: octave --no-gui --quiet --eval "addpath('community/projects/a100-indoor-cart-mti/tests'); test_fixed_noise;"
