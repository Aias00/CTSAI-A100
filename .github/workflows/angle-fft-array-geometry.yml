name: angle-fft-array-geometry
on:
  push:
    branches: [fix/angle-fft-array-geometry]
  pull_request:
    paths:
      - 'community/projects/a100-matlab-adc-signal-processing/**'
jobs:
  octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - run: octave --no-gui --quiet --eval "addpath('community/projects/a100-matlab-adc-signal-processing/tests'); run_array_geometry_tests; run_configuration_tests;"
