name: angle-capture-sync-guard
on:
  push:
    branches: [fix/angle-capture-sync-guard]
  pull_request:
    paths:
      - 'community/projects/a100-matlab-adc-signal-processing/**'
jobs:
  octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - run: octave --no-gui --quiet --eval "addpath('community/projects/a100-matlab-adc-signal-processing/tests'); run_capture_sync_tests; run_configuration_tests;"
  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('community/projects/a100-matlab-adc-signal-processing/tests'); run_capture_sync_tests; run_capture_sync_table_tests
