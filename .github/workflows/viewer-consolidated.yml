name: Python viewer regression
on:
  push:
    branches: [fix/viewer-consolidated]
  pull_request:
    paths:
      - 'Python雷达可视化工具示例/**'
      - '.github/workflows/viewer-consolidated.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy scipy pandas matplotlib scikit-learn
      - run: python -m unittest discover -s Python雷达可视化工具示例/tests -p 'test_*.py' -v
        env:
          MPLBACKEND: Agg
          PYTHONDONTWRITEBYTECODE: '1'
